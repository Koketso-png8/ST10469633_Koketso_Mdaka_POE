<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Linda's Sweet Treats - Custom Order</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

</head>

<body>

<header>

    <h1>Linda's Sweet Treats 🍬</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="about.html">About Us</a>

        <a href="products.html">Products</a>

        <a href="enquiry.html">Custom Order</a>

        <a href="contact.html">Contact</a>

    </nav>

</header>


<section class="page-title">

    <h2>Custom Order</h2>

    <p>
        Tell us what sweet treat you would like.
    </p>

</section>


<main>

    <section>

        <h2>Place an Enquiry</h2>

        <p>
            Complete the form below and Lind's Sweet Treats
            will contact you regarding your order.
        </p>


        <form action="#" method="post">

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required>


            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required>


            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email address"
                required>


            <label for="product">
                Select Product
            </label>

            <select
                id="product"
                name="product"
                required>

                <option value="">
                    Select a product
                </option>

                <option value="candy-bouquet">
                    Custom Candy Bouquet
                </option>

                <option value="snack-box">
                    Sweet Snack Box
                </option>

                <option value="celebration-gift">
                    Personalised Celebration Gift
                </option>

                <option value="sweet-arrangement">
                    Sweet Treat Arrangement
                </option>

                <option value="gift-hamper">
                    Sweet Gift Hamper
                </option>

            </select>


            <label for="date">
                Required Date
            </label>

            <input
                type="date"
                id="date"
                name="date"
                required>


            <label for="budget">
                Budget
            </label>

            <input
                type="text"
                id="budget"
                name="budget"
                placeholder="Example: R300">


            <label for="message">
                Order Details
            </label>

            <textarea
                id="message"
                name="message"
                placeholder="Tell us about your preferred colours, sweets and theme."
                required></textarea>


            <button
                type="submit"
                class="button">

                Submit Enquiry

            </button>

        </form>

    </section>

</main>


<footer>

    <p>
        &copy; 2026 Lind's Sweet Treats.
    </p>

    <p>
        083 397 8483 / 081 498 2881
    </p>

</footer>

</body>
</html>
